services:
  botmem-api:
    image: ghcr.io/botmem/botmem-api:latest
    env_file:
      - .env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      DATABASE_URL: postgresql://botmem:botmem@postgres:5432/botmem
      REDIS_URL: redis://redis:6379
      # Use host.docker.internal if Ollama runs on the host machine (not in Docker).
      # Use http://ollama:11434 if using the bundled Ollama container (--profile ollama).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      APP_SECRET: ${APP_SECRET:-dev-app-secret-change-in-production}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production}
      OAUTH_JWT_SECRET: ${OAUTH_JWT_SECRET:-dev-oauth-jwt-secret-change-in-production}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_TEXT_MODEL: ${OLLAMA_TEXT_MODEL:-qwen3:0.6b}
      OLLAMA_VL_MODEL: ${OLLAMA_VL_MODEL:-qwen3-vl:2b}
      APP_URL: ${APP_URL:-http://localhost:12412}
      BASE_URL: ${BASE_URL:-http://localhost:12412}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:12412}
      SYNC_DEBUG_LIMIT: ${SYNC_DEBUG_LIMIT:-0}
      DB_POOL_MAX: ${DB_POOL_MAX:-500}
      BOTMEM_ENABLE_API_WORKERS: ${BOTMEM_ENABLE_API_WORKERS:-true}
    volumes:
      - api-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:12412/api/version || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  botmem-app:
    image: ghcr.io/botmem/botmem-app:latest
    ports:
      - '12412:8080'
    environment:
      API_UPSTREAM: http://botmem-api:12412
    depends_on:
      botmem-api:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    shm_size: '256m'
    command: ['postgres', '-c', 'max_connections=600']
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: botmem
      POSTGRES_PASSWORD: botmem
      POSTGRES_DB: botmem
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U botmem -d botmem']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:0.6.2
    profiles:
      - ollama
    ports:
      - '11434:11434'
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ['CMD-SHELL', "bash -c 'echo > /dev/tcp/localhost/11434'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  jaeger:
    image: jaegertracing/all-in-one:latest
    profiles:
      - tracing
    ports:
      - '16686:16686' # Jaeger UI
      - '4318:4318' # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    healthcheck:
      test: ['CMD-SHELL', "bash -c 'echo > /dev/tcp/localhost/16686'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  ollama-data:
  api-data:
