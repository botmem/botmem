# Botmem — Unraid Companion Stack
#
# This docker-compose is for users who want to run Botmem's API dependencies
# (PostgreSQL + pgvector and Redis) and the Botmem API alongside the Botmem
# Community Applications frontend container on Unraid.
#
# If you already run these services on your Unraid server, skip this file
# and point the Botmem container's env vars to your existing instances.
#
# Usage:
#   1. Save to /mnt/user/appdata/botmem/docker-compose.unraid.yml
#   2. Edit the passwords below
#   3. Run: docker compose -f /mnt/user/appdata/botmem/docker-compose.unraid.yml up -d
#   4. Install Botmem from Community Applications.
#   5. Keep the Botmem template default:
#      API_UPSTREAM=http://host.docker.internal:12413
#
# Ports intentionally avoid common defaults because many Unraid systems already run
# PostgreSQL on 5432/5433 and Redis on 6379.

services:
  botmem-api:
    image: ghcr.io/botmem/botmem-api:latest
    container_name: botmem-api
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      DATABASE_URL: postgresql://botmem:${POSTGRES_PASSWORD:-changeme}@botmem-postgres:5432/botmem
      REDIS_URL: redis://botmem-redis:6379
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      OAUTH_JWT_SECRET: ${OAUTH_JWT_SECRET:?Set OAUTH_JWT_SECRET in .env}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:?Set ENCRYPTION_SALT in .env}
      APP_URL: ${APP_URL:-http://host.docker.internal:12412}
      BASE_URL: ${BASE_URL:-http://host.docker.internal:12412}
      FRONTEND_URL: ${FRONTEND_URL:-http://host.docker.internal:12412}
      BOTMEM_ENABLE_API_WORKERS: ${BOTMEM_ENABLE_API_WORKERS:-true}
      AI_BACKEND: ${AI_BACKEND:-ollama}
      EMBED_BACKEND: ${EMBED_BACKEND:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-mxbai-embed-large}
      OLLAMA_TEXT_MODEL: ${OLLAMA_TEXT_MODEL:-qwen3:8b}
      OLLAMA_VL_MODEL: ${OLLAMA_VL_MODEL:-qwen3-vl:4b}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PLUGINS_DIR: /plugins
    volumes:
      - /mnt/user/appdata/botmem/data:/app/data
      - /mnt/user/appdata/botmem/plugins:/plugins:ro
    ports:
      - '12413:12412'
    depends_on:
      botmem-postgres:
        condition: service_healthy
      botmem-redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:12412/api/version || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  botmem-postgres:
    image: pgvector/pgvector:pg16
    container_name: botmem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: botmem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: botmem
    volumes:
      - /mnt/user/appdata/botmem/postgres:/var/lib/postgresql/data
    ports:
      - '15432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U botmem -d botmem']
      interval: 5s
      timeout: 3s
      retries: 5

  botmem-redis:
    image: redis:7.4-alpine
    container_name: botmem-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - /mnt/user/appdata/botmem/redis:/data
    ports:
      - '16379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
