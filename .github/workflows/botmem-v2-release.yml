name: Botmem v2 Release Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without a leading v
        required: true
        type: string
      build_number:
        description: Positive macOS bundle build number
        required: true
        type: string
  push:
    tags:
      - 'botmem-v2-v*'

concurrency:
  group: botmem-v2-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  metadata:
    name: Resolve one release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      build_number: ${{ steps.release.outputs.build_number }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      ci_run_url: ${{ steps.release.outputs.ci_run_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Resolve and validate release metadata
        id: release
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          MANUAL_BUILD_NUMBER: ${{ inputs.build_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#botmem-v2-v}"
            BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          else
            VERSION="$MANUAL_VERSION"
            BUILD_NUMBER="$MANUAL_BUILD_NUMBER"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          SOURCE_COMMIT="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          CI_RUN_ID=''
          for _ in {1..20}; do
            CI_RUN_ID="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/botmem-v2-ci.yml/runs?head_sha=$SOURCE_COMMIT&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion == "success" and .event == "push" and .head_branch == "main")][0].id // empty')"
            [[ -n "$CI_RUN_ID" ]] && break
            sleep 15
          done
          [[ -n "$CI_RUN_ID" ]] || {
            echo 'no successful Botmem v2 CI push run exists for this exact main commit' >&2
            exit 1
          }
          {
            echo "version=$VERSION"
            echo "build_number=$BUILD_NUMBER"
            echo "source_commit=$SOURCE_COMMIT"
            echo "ci_run_url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID"
          } >> "$GITHUB_OUTPUT"
  cli:
    name: Package standalone CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [metadata]
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: botmem-v2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9.15.0
          package_json_file: botmem-v2/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: botmem-v2/pnpm-lock.yaml
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:cli
        env:
          BOTMEM_VERSION: ${{ needs.metadata.outputs.version }}
      - name: Keyless-sign and immediately verify the CLI package
        run: |
          set -euo pipefail
          cli_tgz="$(find artifacts/cli -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$cli_tgz"
          bundle="${cli_tgz}.sigstore.json"
          cosign sign-blob --yes --bundle "$bundle" "$cli_tgz"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/botmem-v2-release.yml@${GITHUB_REF}"
          cosign verify-blob --bundle "$bundle" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$cli_tgz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: botmem-v2-cli-release
          path: |
            botmem-v2/artifacts/cli/*.tgz
            botmem-v2/artifacts/cli/*.sha256
            botmem-v2/artifacts/cli/*.sigstore.json
            botmem-v2/artifacts/cli/*.cdx.json
          if-no-files-found: error

  macos:
    name: Sign, notarize, and verify Universal DMG
    runs-on: macos-15
    timeout-minutes: 60
    needs: [metadata]
    environment: botmem-v2-macos-release
    defaults:
      run:
        working-directory: botmem-v2
    env:
      APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
      APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_RELEASE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_RELEASE_KEYCHAIN_PASSWORD }}
      DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
      APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      NOTARY_PROFILE: botmem-v2-notary
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Pin Rust and install both Apple targets
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Import isolated Developer ID and notary credentials
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/botmem-v2-release.keychain-db
          CERTIFICATE_PATH: ${{ runner.temp }}/botmem-v2-developer-id.p12
          NOTARY_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          set -euo pipefail
          : "${APPLE_DEVELOPER_ID_P12_BASE64:?missing APPLE_DEVELOPER_ID_P12_BASE64}"
          : "${APPLE_DEVELOPER_ID_P12_PASSWORD:?missing APPLE_DEVELOPER_ID_P12_PASSWORD}"
          : "${APPLE_RELEASE_KEYCHAIN_PASSWORD:?missing APPLE_RELEASE_KEYCHAIN_PASSWORD}"
          : "${DEVELOPER_ID_APPLICATION:?missing APPLE_DEVELOPER_ID_APPLICATION}"
          : "${APPLE_NOTARY_PRIVATE_KEY_BASE64:?missing APPLE_NOTARY_PRIVATE_KEY_BASE64}"
          : "${APPLE_NOTARY_KEY_ID:?missing APPLE_NOTARY_KEY_ID}"
          : "${APPLE_NOTARY_ISSUER_ID:?missing APPLE_NOTARY_ISSUER_ID}"
          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY_BASE64" | /usr/bin/base64 -D > "$NOTARY_KEY_PATH"
          chmod 0600 "$CERTIFICATE_PATH" "$NOTARY_KEY_PATH"
          security create-keychain -p "$APPLE_RELEASE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_RELEASE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$APPLE_RELEASE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"
      - name: Test source and build signed notarized DMG
        env:
          BOTMEM_VERSION: ${{ needs.metadata.outputs.version }}
          BOTMEM_BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
          BOTMEM_SOURCE_COMMIT: ${{ needs.metadata.outputs.source_commit }}
        run: |
          ./scripts/build-universal-tunnel.sh
          ./scripts/macos/release.sh
      - name: Recheck final release evidence
        run: |
          set -euo pipefail
          test -s macos/release/Botmem.dmg
          test -s macos/release/Botmem.dmg.sha256
          test -s macos/release/Botmem.dmg.cdx.json
          test "$(plutil -extract ok raw -o - macos/release/release-verification.json)" = true
          test "$(plutil -extract checks.enrollmentLaunchAtLoginDefaultTested raw -o - macos/release/release-verification.json)" = true
          test "$(plutil -extract checks.coldLoginResumeContractTested raw -o - macos/release/release-verification.json)" = true
          (cd macos/release && shasum -a 256 -c Botmem.dmg.sha256)
          xcrun stapler validate macos/release/Botmem.dmg
          spctl --assess --type open --context context:primary-signature --verbose=4 \
            macos/release/Botmem.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: botmem-v2-macos-release
          path: |
            botmem-v2/macos/release/Botmem.dmg
            botmem-v2/macos/release/Botmem.dmg.sha256
            botmem-v2/macos/release/Botmem.dmg.cdx.json
            botmem-v2/macos/release/release-preflight.json
            botmem-v2/macos/release/release-verification.json
          if-no-files-found: error
      - name: Destroy temporary signing material
        if: always()
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/botmem-v2-release.keychain-db
          CERTIFICATE_PATH: ${{ runner.temp }}/botmem-v2-developer-id.p12
          NOTARY_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$CERTIFICATE_PATH" "$NOTARY_KEY_PATH"

  github-release:
    name: Attach verified artifacts to tagged release
    if: github.ref_type == 'tag'
    needs: [metadata, cli, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: botmem-v2-*-release
          path: release-artifacts
          merge-multiple: true
      - name: Create immutable GitHub release and attach evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          SOURCE_COMMIT: ${{ needs.metadata.outputs.source_commit }}
          CI_RUN_URL: ${{ needs.metadata.outputs.ci_run_url }}
        run: |
          set -euo pipefail
          CLI_TGZ="$(find release-artifacts -name '*.tgz' -print -quit)"
          CLI_BUNDLE="$(find release-artifacts -name '*.tgz.sigstore.json' -print -quit)"
          MAC_VERIFY="$(find release-artifacts -name release-verification.json -print -quit)"
          CLI_SBOM="$(find release-artifacts -name '*.tgz.cdx.json' -print -quit)"
          MAC_SBOM="$(find release-artifacts -name 'Botmem.dmg.cdx.json' -print -quit)"
          test "$(tar -xOf "$CLI_TGZ" package/package.json | jq -r .version)" = "$RELEASE_VERSION"
          test "$(jq -r .version "$MAC_VERIFY")" = "$RELEASE_VERSION"
          test "$(jq -r .checks.licenseBundled "$MAC_VERIFY")" = true
          test "$(jq -r .checks.sourceNoticeBundled "$MAC_VERIFY")" = true
          test "$(jq -r .sourceCommit "$MAC_VERIFY")" = "$SOURCE_COMMIT"
          [[ "$(jq -r .licenseSha256 "$MAC_VERIFY")" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(jq -r .sourceNoticeSha256 "$MAC_VERIFY")" =~ ^[0-9a-f]{64}$ ]]
          test "$(jq -r .metadata.component.version "$CLI_SBOM")" = "$RELEASE_VERSION"
          test "$(jq -r .metadata.component.version "$MAC_SBOM")" = "$RELEASE_VERSION"
          test "$(jq -r '.metadata.component.licenses[0].license.id' "$MAC_SBOM")" = AGPL-3.0-only
          test "$(jq '[.components[] | select(.name == "Contents/Resources/LICENSE.txt")] | length' "$MAC_SBOM")" = 1
          test "$(jq '[.components[] | select(.name == "Contents/Resources/SOURCE-NOTICE.txt")] | length' "$MAC_SBOM")" = 1
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/botmem-v2-release.yml@${GITHUB_REF}"
          cosign verify-blob --bundle "$CLI_BUNDLE" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$CLI_TGZ"
          CLI_SHA="$(cut -d ' ' -f 1 "$CLI_TGZ.sha256")"
          MAC_SHA="$(cut -d ' ' -f 1 release-artifacts/Botmem.dmg.sha256)"
          RELEASE_BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          CLI_NAME="$(basename "$CLI_TGZ")"
          cat > release-artifacts/botmem-public-release.env <<EOF
          BOTMEM_MAC_DMG_URL=$RELEASE_BASE/Botmem.dmg
          BOTMEM_MAC_DMG_VERSION=$RELEASE_VERSION
          BOTMEM_MAC_DMG_SHA256=$MAC_SHA
          BOTMEM_CLI_TGZ_URL=$RELEASE_BASE/$CLI_NAME
          BOTMEM_CLI_TGZ_VERSION=$RELEASE_VERSION
          BOTMEM_CLI_TGZ_SHA256=$CLI_SHA
          EOF
          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg macUrl "$RELEASE_BASE/Botmem.dmg" \
            --arg macSha "$MAC_SHA" \
            --arg cliUrl "$RELEASE_BASE/$CLI_NAME" \
            --arg cliSha "$CLI_SHA" \
            '{schema:"botmem.public-release.v1", version:$version, macos:{url:$macUrl,sha256:$macSha}, cli:{url:$cliUrl,sha256:$cliSha}}' \
            > release-artifacts/botmem-public-release.json
          jq -n \
            --arg commit "$SOURCE_COMMIT" \
            --arg mainRef "refs/heads/main" \
            --arg ciRunUrl "$CI_RUN_URL" \
            '{schema:"botmem.release-provenance.v1", sourceCommit:$commit, requiredMainRef:$mainRef, botmemV2CiRun:$ciRunUrl, tagSignatureClaim:false}' \
            > release-artifacts/botmem-release-provenance.json
          mapfile -t FILES < <(find release-artifacts -type f -print | sort)
          test "${#FILES[@]}" -ge 9
          gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
            --verify-tag --generate-notes --title "Botmem v2 $RELEASE_VERSION"
          ASSETS="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          grep -qx 'botmem-public-release.env' <<<"$ASSETS"
          grep -qx 'botmem-public-release.json' <<<"$ASSETS"
          grep -qx 'botmem-release-provenance.json' <<<"$ASSETS"
          grep -qx "$(basename "$CLI_BUNDLE")" <<<"$ASSETS"
          {
            echo '### Runtime public release configuration'
            echo '```dotenv'
            cat release-artifacts/botmem-public-release.env
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
