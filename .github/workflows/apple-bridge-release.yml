name: Apple Bridge Release

on:
  pull_request:
    paths:
      - '.github/workflows/apple-bridge-release.yml'
      - 'packages/apple-bridge/**'
      - 'packages/apple-bridge-engine/**'
      - 'apps/api/src/apple-tunnel/**'
      - 'apps/api/src/accounts/**'
      - 'apps/api/src/jobs/**'
      - 'packages/connectors/imessage/**'
      - 'pnpm-lock.yaml'
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - '.github/workflows/apple-bridge-release.yml'
      - 'packages/apple-bridge/**'
      - 'packages/apple-bridge-engine/**'
      - 'apps/api/src/apple-tunnel/**'
      - 'apps/api/src/accounts/**'
      - 'apps/api/src/jobs/**'
      - 'packages/connectors/imessage/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }} DMG
    runs-on: ${{ matrix.runner }}
    env:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64
            runner: macos-14
            dmg: botmem-arm64.dmg

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal \
            --component clippy,rustfmt --target aarch64-apple-darwin
          rustup override set 1.96.0

      - name: Validate Rust engine
        run: |
          cargo fmt --manifest-path packages/apple-bridge-engine/Cargo.toml --check
          cargo clippy --manifest-path packages/apple-bridge-engine/Cargo.toml \
            --all-targets --all-features -- -D warnings
          cargo test --manifest-path packages/apple-bridge-engine/Cargo.toml --all-features

      - run: pnpm install --frozen-lockfile

      - name: Import signing certificate
        if: env.APPLE_CERTIFICATE_P12_BASE64 != ''
        run: |
          CERT_PATH="$RUNNER_TEMP/botmem-apple-bridge.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      - name: Build DMG
        run: pnpm --filter @botmem/apple-bridge build:mac-app
        env:
          # The engine is the Rust static lib; build it for the runner's arch.
          BOTMEM_RUST_TARGET: aarch64-apple-darwin
          BOTMEM_DMG_NAME: ${{ matrix.dmg }}
          BOTMEM_CODESIGN_IDENTITY: ${{ secrets.BOTMEM_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.dmg }}
          path: packages/apple-bridge/dist-macos/${{ matrix.dmg }}

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "packages/apple-bridge/dist-macos/${{ matrix.dmg }}" --clobber
