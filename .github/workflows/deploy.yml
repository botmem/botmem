name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gate:
    name: Deployment Gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Check for open Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN_DEPENDABOT_PRS=$(gh pr list --repo "${{ github.repository }}" --author "app/dependabot" --state open --json number,title --jq 'length')
          if [ "$OPEN_DEPENDABOT_PRS" -gt 0 ]; then
            echo "WARNING: $OPEN_DEPENDABOT_PRS open Dependabot PR(s) — merge or close them."
            gh pr list --repo "${{ github.repository }}" --author "app/dependabot" --state open --json number,title --jq '.[] | "  - PR #\(.number): \(.title)"'
          fi

  version:
    name: Determine Version
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [gate]
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prev: ${{ steps.version.outputs.prev }}
      has_previous_tag: ${{ steps.version.outputs.has_previous_tag }}
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          git fetch --tags
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            NEXT="v0.1.0"
            PREV_REF=$(git rev-list --max-parents=0 HEAD)
            HAS_PREVIOUS_TAG=false
          else
            PREV_REF="$LATEST_TAG"
            HAS_PREVIOUS_TAG=true
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"

            COMMITS=$(git log "$LATEST_TAG"..HEAD --pretty=format:"%s")
            if echo "$COMMITS" | grep -qiE "^(feat|feature)(\(.+\))?!:|BREAKING CHANGE"; then
              MINOR=$((MINOR + 1))
              PATCH=0
            elif echo "$COMMITS" | grep -qiE "^feat(\(.+\))?:"; then
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
            NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
          echo "version=${NEXT#v}" >> "$GITHUB_OUTPUT"
          echo "prev=$PREV_REF" >> "$GITHUB_OUTPUT"
          echo "has_previous_tag=$HAS_PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT (previous: $PREV_REF)"

  changes:
    name: Detect Changed Artifacts
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [version]
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      web: ${{ steps.detect.outputs.web }}
      docs: ${{ steps.detect.outputs.docs }}
      apple_bridge: ${{ steps.detect.outputs.apple_bridge }}
      cli: ${{ steps.detect.outputs.cli }}
      openclaw_plugin: ${{ steps.detect.outputs.openclaw_plugin }}
      skills: ${{ steps.detect.outputs.skills }}
      infra_deploy: ${{ steps.detect.outputs.infra_deploy }}
      runtime: ${{ steps.detect.outputs.runtime }}
      binary: ${{ steps.detect.outputs.binary }}
      changed_any: ${{ steps.detect.outputs.changed_any }}
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed artifact groups
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          BASE="${{ needs.version.outputs.prev }}"
          if ! git rev-parse --verify "$BASE^{commit}" >/dev/null 2>&1; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi

          if [ "${{ needs.version.outputs.has_previous_tag }}" != "true" ]; then
            CHANGED="__initial_release__"
          else
            CHANGED="$(git diff --name-only "$BASE"..HEAD)"
          fi

          echo "Changed files:"
          printf '%s\n' "$CHANGED"

          backend=false
          web=false
          docs=false
          apple_bridge=false
          cli=false
          openclaw_plugin=false
          skills=false
          infra_deploy=false

          mark_all_buildable() {
            backend=true
            web=true
            docs=true
            apple_bridge=true
            cli=true
            openclaw_plugin=true
            skills=true
          }

          if [ "$CHANGED" = "__initial_release__" ]; then
            mark_all_buildable
          else
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                package.json|pnpm-lock.yaml|pnpm-workspace.yaml|turbo.json)
                  mark_all_buildable
                  ;;
                scripts/deploy.sh|.github/workflows/deploy.yml)
                  backend=true
                  web=true
                  docs=true
                  apple_bridge=true
                  infra_deploy=true
                  ;;
                Dockerfile|docker/**|docker-compose.prod.yml|Caddyfile.production)
                  backend=true
                  web=true
                  infra_deploy=true
                  ;;
                apps/api/src/apple-tunnel/**|apps/api/src/accounts/**|apps/api/src/jobs/**|packages/connectors/imessage/**)
                  backend=true
                  apple_bridge=true
                  ;;
                apps/api/**|packages/connector-sdk/**|packages/connectors/**)
                  backend=true
                  ;;
                docs/**)
                  docs=true
                  ;;
                packages/apple-bridge/**|.github/workflows/apple-bridge-release.yml)
                  apple_bridge=true
                  ;;
                packages/shared/**)
                  backend=true
                  web=true
                  cli=true
                  ;;
                apps/web/**)
                  web=true
                  ;;
                packages/cli/**)
                  cli=true
                  ;;
                packages/openclaw-plugin/**)
                  openclaw_plugin=true
                  ;;
                .agents/skills/botmem-cli/**)
                  skills=true
                  cli=true
                  ;;
                .agents/skills/**|.agents/react-doctor/**)
                  skills=true
                  ;;
              esac
            done <<< "$CHANGED"
          fi

          runtime=false
          if [ "$backend" = true ] || [ "$web" = true ] || [ "$infra_deploy" = true ]; then
            runtime=true
          fi

          binary=false
          if [ "$apple_bridge" = true ]; then
            binary=true
          fi

          changed_any=false
          if [ "$runtime" = true ] || [ "$docs" = true ] || [ "$apple_bridge" = true ] || [ "$cli" = true ] || [ "$openclaw_plugin" = true ]; then
            changed_any=true
          fi

          {
            echo "backend=$backend"
            echo "web=$web"
            echo "docs=$docs"
            echo "apple_bridge=$apple_bridge"
            echo "cli=$cli"
            echo "openclaw_plugin=$openclaw_plugin"
            echo "skills=$skills"
            echo "infra_deploy=$infra_deploy"
            echo "runtime=$runtime"
            echo "binary=$binary"
            echo "changed_any=$changed_any"
          } >> "$GITHUB_OUTPUT"

          cat << SUMMARY >> "$GITHUB_STEP_SUMMARY"
          ## Changed Artifact Groups

          - Backend runtime: \`$backend\`
          - Web runtime: \`$web\`
          - Docs: \`$docs\`
          - Apple bridge DMG: \`$apple_bridge\`
          - CLI npm package: \`$cli\`
          - OpenClaw npm package: \`$openclaw_plugin\`
          - Skills: \`$skills\`
          - Infra deploy: \`$infra_deploy\`
          - Any releasable/deployable artifact: \`$changed_any\`
          SUMMARY

  quality-gate:
    name: Lint & Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [changes]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.5
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Lint
        run: pnpm lint

      - name: Run tests with coverage
        run: pnpm test:coverage
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}

  build-amd64:
    name: Build Changed Images (amd64)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [version, changes, quality-gate]
    if: needs.changes.outputs.runtime == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        if: needs.changes.outputs.backend == 'true'
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          target: api
          push: true
          build-args: |
            VITE_AUTH_PROVIDER=firebase
            VITE_POSTHOG_API_KEY=${{ secrets.VITE_POSTHOG_API_KEY }}
            VITE_POSTHOG_HOST=https://t.botmem.xyz
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=app.botmem.xyz
            VITE_WEB_SURFACE=app
            VITE_API_ORIGIN=https://app.botmem.xyz
            VITE_API_BASE_URL=https://app.botmem.xyz/api
            VITE_APP_URL=https://app.botmem.xyz
            VITE_LANDING_URL=https://botmem.xyz
            VITE_FIREBASE_PROJECT_ID=botmem-app
            VITE_FIREBASE_STORAGE_BUCKET=botmem-app.firebasestorage.app
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
            BOTMEM_BUILD_SHA=${{ github.sha }}
            BOTMEM_BUILD_VERSION=${{ needs.version.outputs.tag }}
          tags: |
            ghcr.io/botmem/botmem:api-amd64-${{ needs.version.outputs.tag }}
          platforms: linux/amd64

      - name: Build and push worker image
        if: needs.changes.outputs.backend == 'true'
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          target: worker
          push: true
          tags: |
            ghcr.io/botmem/botmem:worker-amd64-${{ needs.version.outputs.tag }}
          platforms: linux/amd64

      - name: Build and push app image
        if: needs.changes.outputs.web == 'true'
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          target: web
          push: true
          build-args: |
            VITE_AUTH_PROVIDER=firebase
            VITE_POSTHOG_API_KEY=${{ secrets.VITE_POSTHOG_API_KEY }}
            VITE_POSTHOG_HOST=https://t.botmem.xyz
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=app.botmem.xyz
            VITE_FIREBASE_PROJECT_ID=botmem-app
            VITE_FIREBASE_STORAGE_BUCKET=botmem-app.firebasestorage.app
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
            VITE_WEB_SURFACE=app
            VITE_API_ORIGIN=https://app.botmem.xyz
            VITE_API_BASE_URL=https://app.botmem.xyz/api
            VITE_APP_URL=https://app.botmem.xyz
            VITE_LANDING_URL=https://botmem.xyz
            BOTMEM_BUILD_SHA=${{ github.sha }}
            BOTMEM_BUILD_VERSION=${{ needs.version.outputs.tag }}
          tags: |
            ghcr.io/botmem/botmem:app-amd64-${{ needs.version.outputs.tag }}
          platforms: linux/amd64

      - name: Build and push landing image
        if: needs.changes.outputs.web == 'true'
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          target: web
          push: true
          build-args: |
            VITE_AUTH_PROVIDER=firebase
            VITE_POSTHOG_API_KEY=${{ secrets.VITE_POSTHOG_API_KEY }}
            VITE_POSTHOG_HOST=https://t.botmem.xyz
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=app.botmem.xyz
            VITE_FIREBASE_PROJECT_ID=botmem-app
            VITE_FIREBASE_STORAGE_BUCKET=botmem-app.firebasestorage.app
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
            VITE_WEB_SURFACE=landing
            VITE_API_ORIGIN=https://app.botmem.xyz
            VITE_API_BASE_URL=https://app.botmem.xyz/api
            VITE_APP_URL=https://app.botmem.xyz
            VITE_LANDING_URL=https://botmem.xyz
            BOTMEM_BUILD_SHA=${{ github.sha }}
            BOTMEM_BUILD_VERSION=${{ needs.version.outputs.tag }}
          tags: |
            ghcr.io/botmem/botmem:landing-amd64-${{ needs.version.outputs.tag }}
          platforms: linux/amd64

  build-arm64:
    name: Build Changed Images (arm64)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [version, changes, quality-gate]
    if: needs.changes.outputs.runtime == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        if: needs.changes.outputs.backend == 'true'
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          target: api
          push: true
          build-args: |
            VITE_AUTH_PROVIDER=firebase
            VITE_POSTHOG_API_KEY=${{ secrets.VITE_POSTHOG_API_KEY }}
            VITE_POSTHOG_HOST=https://t.botmem.xyz
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=app.botmem.xyz
            VITE_WEB_SURFACE=app
            VITE_API_ORIGIN=https://app.botmem.xyz
            VITE_API_BASE_URL=https://app.botmem.xyz/api
            VITE_APP_URL=https://app.botmem.xyz
            VITE_LANDING_URL=https://botmem.xyz
            VITE_FIREBASE_PROJECT_ID=botmem-app
            VITE_FIREBASE_STORAGE_BUCKET=botmem-app.firebasestorage.app
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
            BOTMEM_BUILD_SHA=${{ github.sha }}
            BOTMEM_BUILD_VERSION=${{ needs.version.outputs.tag }}
          tags: |
            ghcr.io/botmem/botmem:api-arm64-${{ needs.version.outputs.tag }}
          platforms: linux/arm64

      - name: Build and push worker image
        if: needs.changes.outputs.backend == 'true'
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          target: worker
          push: true
          tags: |
            ghcr.io/botmem/botmem:worker-arm64-${{ needs.version.outputs.tag }}
          platforms: linux/arm64

      - name: Build and push app image
        if: needs.changes.outputs.web == 'true'
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          target: web
          push: true
          build-args: |
            VITE_AUTH_PROVIDER=firebase
            VITE_POSTHOG_API_KEY=${{ secrets.VITE_POSTHOG_API_KEY }}
            VITE_POSTHOG_HOST=https://t.botmem.xyz
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=app.botmem.xyz
            VITE_FIREBASE_PROJECT_ID=botmem-app
            VITE_FIREBASE_STORAGE_BUCKET=botmem-app.firebasestorage.app
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
            VITE_WEB_SURFACE=app
            VITE_API_ORIGIN=https://app.botmem.xyz
            VITE_API_BASE_URL=https://app.botmem.xyz/api
            VITE_APP_URL=https://app.botmem.xyz
            VITE_LANDING_URL=https://botmem.xyz
            BOTMEM_BUILD_SHA=${{ github.sha }}
            BOTMEM_BUILD_VERSION=${{ needs.version.outputs.tag }}
          tags: |
            ghcr.io/botmem/botmem:app-arm64-${{ needs.version.outputs.tag }}
          platforms: linux/arm64

      - name: Build and push landing image
        if: needs.changes.outputs.web == 'true'
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          target: web
          push: true
          build-args: |
            VITE_AUTH_PROVIDER=firebase
            VITE_POSTHOG_API_KEY=${{ secrets.VITE_POSTHOG_API_KEY }}
            VITE_POSTHOG_HOST=https://t.botmem.xyz
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=app.botmem.xyz
            VITE_FIREBASE_PROJECT_ID=botmem-app
            VITE_FIREBASE_STORAGE_BUCKET=botmem-app.firebasestorage.app
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
            VITE_WEB_SURFACE=landing
            VITE_API_ORIGIN=https://app.botmem.xyz
            VITE_API_BASE_URL=https://app.botmem.xyz/api
            VITE_APP_URL=https://app.botmem.xyz
            VITE_LANDING_URL=https://botmem.xyz
            BOTMEM_BUILD_SHA=${{ github.sha }}
            BOTMEM_BUILD_VERSION=${{ needs.version.outputs.tag }}
          tags: |
            ghcr.io/botmem/botmem:landing-arm64-${{ needs.version.outputs.tag }}
          platforms: linux/arm64

  promote-runtime-images:
    name: Promote Runtime Image Tags
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs:
      - version
      - changes
      - quality-gate
      - build-amd64
      - build-arm64
    if: |
      always() &&
      needs.quality-gate.result == 'success' &&
      needs.changes.outputs.runtime == 'true' &&
      needs.build-amd64.result == 'success' &&
      needs.build-arm64.result == 'success'
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or promote multi-arch manifests
        run: |
          set -euo pipefail
          TAG="${{ needs.version.outputs.tag }}"
          promote_image() {
            local image="$1"
            local changed="$2"
            local repo="ghcr.io/botmem/botmem"

            if [ "$changed" = "true" ]; then
              echo "Creating manifest for changed image ${image}:${TAG}"
              docker buildx imagetools create -t "${repo}:${image}-${TAG}" \
                "${repo}:${image}-amd64-${TAG}" \
                "${repo}:${image}-arm64-${TAG}"
              docker buildx imagetools create -t "${repo}:${image}-latest" \
                "${repo}:${image}-amd64-${TAG}" \
                "${repo}:${image}-arm64-${TAG}"
            else
              echo "Promoting unchanged image ${image}:latest to ${TAG}"
              docker buildx imagetools create -t "${repo}:${image}-${TAG}" "${repo}:${image}-latest"
              docker buildx imagetools create -t "${repo}:${image}-latest" "${repo}:${image}-${TAG}"
            fi
          }

          promote_image api "${{ needs.changes.outputs.backend }}"
          promote_image worker "${{ needs.changes.outputs.backend }}"
          promote_image app "${{ needs.changes.outputs.web }}"
          promote_image landing "${{ needs.changes.outputs.web }}"

  deploy:
    name: Deploy Changed Surfaces
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [version, changes, quality-gate, promote-runtime-images]
    if: |
      always() &&
      needs.quality-gate.result == 'success' &&
      (
        (needs.changes.outputs.runtime == 'true' && needs.promote-runtime-images.result == 'success') ||
        (needs.changes.outputs.runtime != 'true' && needs.promote-runtime-images.result == 'skipped')
      ) &&
      (needs.changes.outputs.runtime == 'true' || needs.changes.outputs.docs == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        if: needs.changes.outputs.docs == 'true'
        uses: pnpm/action-setup@v6.0.5
        with:
          version: 9.15.0

      - name: Setup Node.js
        if: needs.changes.outputs.docs == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install docs dependencies
        if: needs.changes.outputs.docs == 'true'
        run: cd docs && pnpm install --frozen-lockfile

      - name: Build docs
        if: needs.changes.outputs.docs == 'true'
        run: cd docs && pnpm build
        env:
          VITE_POSTHOG_API_KEY: ${{ secrets.VITE_POSTHOG_API_KEY }}
          VITE_POSTHOG_HOST: https://t.botmem.xyz

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --login-server=${{ secrets.TAILSCALE_LOGIN_SERVER }}
          hostname: github-ci-${{ github.run_id }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_TAILSCALE_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy runtime surfaces to VPS
        if: needs.changes.outputs.runtime == 'true'
        timeout-minutes: 240
        env:
          IMAGE_TAG: ${{ needs.version.outputs.tag }}
          DEPLOY_BACKEND: ${{ needs.changes.outputs.backend }}
          DEPLOY_WEB: ${{ needs.changes.outputs.web }}
          INFRA_DEPLOY: ${{ needs.changes.outputs.infra_deploy }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=10 -o ServerAliveCountMax=3"
          VPS="root@${{ secrets.VPS_TAILSCALE_HOST }}"

          scp $SSH_OPTS scripts/deploy.sh ${VPS}:/opt/botmem/deploy.sh
          scp $SSH_OPTS docker-compose.prod.yml ${VPS}:/opt/botmem/docker-compose.prod.yml
          scp $SSH_OPTS Caddyfile.production ${VPS}:/opt/botmem/Caddyfile
          ssh $SSH_OPTS ${VPS} "chmod +x /opt/botmem/deploy.sh"

          BACKEND="$DEPLOY_BACKEND"
          WEB="$DEPLOY_WEB"
          if [ "$INFRA_DEPLOY" = "true" ]; then
            BACKEND=true
            WEB=true
          fi

          ssh $SSH_OPTS ${VPS} << DEPLOY
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            DEPLOY_BACKEND=${BACKEND} DEPLOY_WEB=${WEB} SKIP_ON_HOST_BACKUP=1 OFF_HOST_BACKUP_CONFIRMED=1 DRAIN_TYPESENSE_ON_NEXT_STARTUP=0 RUN_SEARCH_BACKFILL=0 HEALTH_TIMEOUT=3600 /opt/botmem/deploy.sh ${IMAGE_TAG}
          DEPLOY

      - name: Deploy docs to VPS
        if: needs.changes.outputs.docs == 'true'
        timeout-minutes: 5
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=10 -o ServerAliveCountMax=3"
          ssh $SSH_OPTS root@${{ secrets.VPS_TAILSCALE_HOST }} 'rm -rf /opt/botmem/docs-site/* && mkdir -p /opt/botmem/docs-site'
          scp $SSH_OPTS -r docs/.vitepress/dist/* root@${{ secrets.VPS_TAILSCALE_HOST }}:/opt/botmem/docs-site/
          ssh $SSH_OPTS root@${{ secrets.VPS_TAILSCALE_HOST }} 'cd /opt/botmem && docker compose --env-file .env.prod -f docker-compose.prod.yml up -d caddy'

      - name: Validate API deployment
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra_deploy == 'true'
        env:
          EXPECTED_VERSION: ${{ needs.version.outputs.tag }}
        run: |
          for i in $(seq 1 12); do
            RESPONSE=$(curl -sf https://api.botmem.xyz/api/version 2>/dev/null || echo "")
            if [ -n "$RESPONSE" ]; then
              echo "API is healthy (attempt $i): $RESPONSE"
              if echo "$RESPONSE" | grep -q "$EXPECTED_VERSION"; then
                echo "Running expected version $EXPECTED_VERSION"
              else
                echo "WARNING: API is healthy but not running $EXPECTED_VERSION"
              fi
              exit 0
            fi
            echo "Attempt $i: not ready yet, waiting 5s..."
            sleep 5
          done
          echo "CRITICAL: API not responding after 60s"
          exit 1

      - name: Validate web surfaces
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.infra_deploy == 'true'
        run: |
          curl -sfI https://botmem.xyz/ >/dev/null
          curl -sfI https://app.botmem.xyz/signup >/dev/null
          curl -sfI https://api.botmem.xyz/.well-known/oauth-protected-resource >/dev/null

      - name: Validate docs
        if: needs.changes.outputs.docs == 'true'
        continue-on-error: true
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://docs.botmem.xyz/)
          if [ "$STATUS" = "200" ]; then
            echo "Docs site is live at https://docs.botmem.xyz/"
          else
            echo "Warning: docs.botmem.xyz returned HTTP $STATUS"
          fi

  publish-cli:
    name: Publish @botmem/cli
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [version, changes, quality-gate]
    if: needs.changes.outputs.cli == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.5
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm build
          VERSION="${{ needs.version.outputs.version }}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          if npm view "@botmem/cli@$VERSION" version 2>/dev/null; then
            echo "Version $VERSION already published — skipping"
          else
            npm publish --access public --tag latest
          fi

