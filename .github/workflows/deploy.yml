  tag:
    name: Tag Successful Pipeline
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs:
      - version
      - changes
      - quality-gate
      - promote-runtime-images
      - deploy
      - publish-cli
      - publish-apple-bridge
      - publish-openclaw-plugin
    if: |
      always() &&
      needs.changes.outputs.changed_any == 'true' &&
      needs.quality-gate.result == 'success' &&
      (
        (needs.changes.outputs.runtime == 'true' && needs.promote-runtime-images.result == 'success') ||
        (needs.changes.outputs.runtime != 'true' && needs.promote-runtime-images.result == 'skipped')
      ) &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') &&
      (needs.publish-cli.result == 'success' || needs.publish-cli.result == 'skipped') &&
      (needs.publish-apple-bridge.result == 'success' || needs.publish-apple-bridge.result == 'skipped') &&
      (needs.publish-openclaw-plugin.result == 'success' || needs.publish-openclaw-plugin.result == 'skipped')
    permissions:
      contents: write
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create git tag
        run: |
          set -euo pipefail
          TAG="${{ needs.version.outputs.tag }}"
          git fetch --tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping"
          else
            git tag "$TAG" "${{ github.sha }}"
            git push origin "$TAG"
          fi

  apple-bridge-release:
    name: Build DMG & Create GitHub Release
    runs-on: macos-14
    needs: [version, changes, tag]
    if: needs.changes.outputs.apple_bridge == 'true'
    permissions:
      contents: write
    env:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      BOTMEM_DMG_NAME: botmem-arm64.dmg
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.0.5
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Import signing certificate
        if: env.APPLE_CERTIFICATE_P12_BASE64 != ''
        run: |
          CERT_PATH="$RUNNER_TEMP/botmem-apple-bridge.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build DMG
        run: |
          export BOTMEM_NODE_BINARY="$(command -v node)"
          pnpm --filter @botmem/apple-bridge build:mac-app
        env:
          BOTMEM_CODESIGN_IDENTITY: ${{ secrets.BOTMEM_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Generate changelog
        run: |
          PREV="${{ needs.version.outputs.prev }}"
          {
            echo "## What's Changed"
            echo ""
            git log "$PREV"..HEAD --pretty=format:"- %s (%h)"
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV}...${{ needs.version.outputs.tag }}"
          } > /tmp/changelog.md
          cat /tmp/changelog.md

      - name: Create GitHub release with DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          DMG="packages/apple-bridge/dist-macos/$BOTMEM_DMG_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
          else
            gh release create "$TAG" "$DMG" \
              --title "$TAG" \
              --notes-file /tmp/changelog.md \
              --target "${{ github.sha }}"
          fi
