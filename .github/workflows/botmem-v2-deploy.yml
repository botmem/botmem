name: Botmem v2 Vultr Deploy

on:
  workflow_run:
    workflows: ['Botmem v2 CI']
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full main-branch commit SHA whose signed images should be deployed
        required: true
        type: string

concurrency:
  group: botmem-v2-vultr-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Backup, restore, canary, and promote on Vultr
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.BOTMEM_V2_AUTO_DEPLOY_ENABLED == 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: botmem-v2-production
    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.event.workflow_run.head_sha }}
    steps:
      - name: Validate immutable release identity
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resolve and verify every signed image manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/botmem-v2-ci.yml@refs/heads/main"
          : > /tmp/release.env
          chmod 0600 /tmp/release.env
          resolve() {
            local variable="$1" image="$2" digest='' reference
            for _ in {1..12}; do
              digest="$(docker buildx imagetools inspect "${image}:${RELEASE_SHA}" 2>/dev/null | sed -n 's/^Digest:[[:space:]]*//p' | head -1)"
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] && break
              sleep 5
            done
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            reference="${image}@${digest}"
            cosign verify --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$reference" >/dev/null
            printf '%s=%s\n' "$variable" "$reference" >> /tmp/release.env
          }
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          resolve BOTMEM_V2_API_IMAGE "$repository/v2-api"
          resolve BOTMEM_V2_SYNC_WORKER_IMAGE "$repository/v2-sync-worker"
          resolve BOTMEM_V2_PROJECTION_WORKER_IMAGE "$repository/v2-projection-worker"
          resolve BOTMEM_V2_COMMERCE_RECONCILER_IMAGE "$repository/v2-commerce-reconciler"
          resolve BOTMEM_V2_LIFECYCLE_WORKER_IMAGE "$repository/v2-lifecycle-worker"
          resolve BOTMEM_V2_WEB_IMAGE "$repository/v2-web"
          resolve BOTMEM_V2_MIGRATOR_IMAGE "$repository/v2-migrator"
          resolve BOTMEM_V2_DATABASE_IMAGE "$repository/v2-database"
          resolve BOTMEM_V2_EDGE_IMAGE "$repository/v2-edge"

      - name: Configure strictly pinned SSH transport
        env:
          SSH_HOST: ${{ secrets.BOTMEM_V2_SSH_HOST }}
          SSH_PORT: ${{ secrets.BOTMEM_V2_SSH_PORT }}
          SSH_USER: ${{ secrets.BOTMEM_V2_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.BOTMEM_V2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.BOTMEM_V2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( SSH_PORT <= 65535 ))
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/botmem-v2
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/botmem-v2-known-hosts
          chmod 0600 ~/.ssh/botmem-v2 ~/.ssh/botmem-v2-known-hosts
          ssh-keygen -y -f ~/.ssh/botmem-v2 >/dev/null
          lookup="$SSH_HOST"
          [[ "$SSH_PORT" == 22 ]] || lookup="[$SSH_HOST]:$SSH_PORT"
          ssh-keygen -F "$lookup" -f ~/.ssh/botmem-v2-known-hosts >/dev/null
          printf '%s\n' \
            'Host botmem' \
            "  HostName $SSH_HOST" \
            "  Port $SSH_PORT" \
            "  User $SSH_USER" \
            '  IdentityFile ~/.ssh/botmem-v2' \
            '  UserKnownHostsFile ~/.ssh/botmem-v2-known-hosts' \
            '  StrictHostKeyChecking yes' \
            '  IdentitiesOnly yes' \
            '  BatchMode yes' \
            '  LogLevel ERROR' > ~/.ssh/config
          chmod 0600 ~/.ssh/config

      - name: Transfer versioned deployment assets
        run: |
          # shellcheck disable=SC2029
          set -euo pipefail
          tar -C botmem-v2 -czf /tmp/botmem-v2-deploy.tgz deploy/vps db/bootstrap db/tests
          ssh botmem install -d -m 0750 "/opt/botmem-v2/releases/$RELEASE_SHA"
          scp /tmp/botmem-v2-deploy.tgz /tmp/release.env "botmem:/opt/botmem-v2/releases/$RELEASE_SHA/"
          # shellcheck disable=SC2029
          ssh botmem chmod 0600 "/opt/botmem-v2/releases/$RELEASE_SHA/release.env"
          # shellcheck disable=SC2029
          ssh botmem tar -xzf "/opt/botmem-v2/releases/$RELEASE_SHA/botmem-v2-deploy.tgz" \
            -C "/opt/botmem-v2/releases/$RELEASE_SHA"

      - name: Provision pinned host prerequisites
        run: |
          # shellcheck disable=SC2029
          ssh botmem "/opt/botmem-v2/releases/$RELEASE_SHA/deploy/vps/bootstrap-host.sh"

      - name: Run encrypted backup, disposable restore, loopback canary, and promotion
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/botmem-v2-ci.yml@refs/heads/main"
          # shellcheck disable=SC2029
          ssh botmem \
            "COSIGN_CERTIFICATE_IDENTITY='$identity' /opt/botmem-v2/releases/$RELEASE_SHA/deploy/vps/deploy.sh /opt/botmem-v2 '$RELEASE_SHA' /opt/botmem-v2/releases/$RELEASE_SHA/release.env"

      - name: Retrieve the verified encrypted backup
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          install -d -m 0700 botmem-v2/reports/production-backup
          archive="$(ssh botmem 'readlink -f /opt/botmem-v2/backups/latest.dump.age')"
          [[ "$archive" =~ ^/opt/botmem-v2/backups/botmem-v2-[0-9]{8}T[0-9]{6}Z\.dump\.age$ ]]
          scp "botmem:$archive" "botmem:$archive.sha256" botmem-v2/reports/production-backup/
          (cd botmem-v2/reports/production-backup && sha256sum --check "$(basename "$archive").sha256")
          head -1 "botmem-v2/reports/production-backup/$(basename "$archive")" | grep -Fqx age-encryption.org/v1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: botmem-v2-encrypted-predeploy-backup-${{ env.RELEASE_SHA }}
          path: botmem-v2/reports/production-backup/*
          if-no-files-found: warn
          retention-days: 30

      - name: Remove transient deployment credentials
        if: always()
        run: rm -f ~/.ssh/botmem-v2 ~/.ssh/botmem-v2-known-hosts ~/.ssh/config /tmp/release.env /tmp/botmem-v2-deploy.tgz
