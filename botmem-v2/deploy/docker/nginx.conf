worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Log only the normalized path. Query capabilities (Stripe completion IDs,
  # OAuth state/codes, email-link tokens) must never reach container logs.
  log_format botmem '[$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent';
  access_log /dev/stdout botmem;
  error_log /dev/stderr warn;
  server_tokens off;
  sendfile on;
  keepalive_timeout 30;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    listen [::]:8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; font-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /health/live {
      access_log off;
      default_type application/json;
      return 200 '{"status":"live"}';
    }

    location = /health/ready {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ready"}';
    }

    location / {
      try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2|png|svg|ico)$ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
  }
}
